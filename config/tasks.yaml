query_refinement_task:
  description: >
    Analyze the user query {query} and extract the following parameters in JSON format.
    Ignore any prefix such as “flight”, “I want a flight”, “book me a flight”:
    - origin (string|null|unrealistic)
    - destination (string|null|unrealistic)
    - departure_time (string|null|unrealistic)
    - constraints (list of objects {type, value})

    RULES:
    1. Return **null** (not None) for any missing information (e.g., if the user does not specify the origin).
    2. Never invent or assume any data.
    3. If the user mentions a **relative time** (e.g., “today”, “tomorrow”, “this evening”, “June 1st at 8pm” without year), **keep that exact string** (e.g., "tomorrow at 8pm" or "June 1st at 8pm"), without adding a year.  
       **If** an explicit date includes a year (e.g., “2023-06-01T20:00:00” or “February 12, 2024”), mark it as “unrealistic” if it is in the past.
    4. If you detect an impossible or unrealistic request (e.g., flight within the same city, budget too low for the trip, contradictory condition), **set the corresponding value to `"unrealistic"`**.  
       — This applies to constraints as well! Examples:
         - “1 euro” for a long-haul flight = `"unrealistic"`
         - “electric plug” on a shared bike = `"unrealistic"`
         - “Ryanair” for a flight from Rabat to Tokyo = `"unrealistic"`
       — You must **reason like a transportation expert**, using your knowledge of pricing, distances, modes, cities, and airlines.
    5. Any preference, requirement, or condition expressed by the user that **is not** one of the three main fields (`origin`, `destination`, `departure_time`) **must be treated as a constraint**.  
       — Do not classify constraints using a fixed list. Use a **freely chosen type** based on the original expression.  
       — For example, “wifi”, “bike allowed”, “electric plug”, “checked baggage”, “flexible” are all valid constraints, each with its own `type` and `value`.

    7. Strictly follow the JSON structure below:

    {
      "origin": "string|null|unrealistic",
      "destination": "string|null|unrealistic",
      "departure_time": "string|null|unrealistic",
      "constraints": [
        {
          "type": "string (e.g., 'budget', 'pet', 'transport_mode', 'airline', 'class', etc.)",
          "value": "string|null|unrealistic"
        }
      ]
    }

    CRITICAL FORMAT RULES:
    1. The JSON must contain **all** closing brackets (`]` and `}`).
    2. No Markdown formatting (no ```json).
    3. Validate your JSON on https://jsonlint.com before submitting.

    EXAMPLES:
    - Input: "Business class flight to Tokyo with $5000 budget"  
      Output:
      {
        "origin": null,
        "destination": "Tokyo",
        "departure_time": null,
        "constraints": [
          { "type": "budget", "value": "5000" },
          { "type": "class", "value": "Business" }
        ]
      }

    - Input: "Flight from Earth to the Moon"  
      Output:
      {
        "origin": "unrealistic",
        "destination": "unrealistic",
        "departure_time": null,
        "constraints": []
      }

    - Input: "Travel to Paris yesterday"  
      Output:
      {
        "origin": null,
        "destination": "Paris",
        "departure_time": "unrealistic",
        "constraints": []
      }

    - Input: "Flight from Dubai to Dubai"  
      Output:
      {
        "origin": "Dubai",
        "destination": "unrealistic",
        "departure_time": null,
        "constraints": []
      }

    - Input: "I want to go from Riyadh to Madrid tomorrow morning"  
      Output:
      {
        "origin": "Riyadh",
        "destination": "Madrid",
        "departure_time": "tomorrow morning",
        "constraints": []
      }

    - Input: "Book a flight from Dammam to Cairo next month, under $10, using Qatar Airways"  
      Output:
      {
        "origin": "Dammam",
        "destination": "Cairo",
        "departure_time": "next month",
        "constraints": [
          { "type": "budget", "value": "unrealistic" },
          { "type": "airline", "value": "Qatar Airways" }
        ]
      }

    - Input: "Je voyage depuis Paris avec un chat et 500 € de budget"  
      Output:
      {
        "origin": "Paris",
        "destination": null,
        "departure_time": null,
        "constraints": [
          { "type": "pet", "value": "chat" },
          { "type": "budget", "value": "500" }
        ]
      }

    - Input: "Train pour Marseille avec 2 euros"
      Output:
      {
        "origin": null,
        "destination": "Marseille",
        "departure_time": null,
        "constraints": [
          { "type": "budget", "value": "unrealistic" }
        ]
      }

    - Input: "Vol à Paris avec 1 euro, en Air France avec prise électrique"
      Output:
      {
        "origin": null,
        "destination": "Paris",
        "departure_time": null,
        "constraints": [
          { "type": "budget", "value": "unrealistic" },
          { "type": "airline", "value": "Air France" },
          { "type": "prise électrique", "value": "true" }
        ]
      }

  expected_output: |
    Return PURE JSON output strictly following the required fields.
    No additional explanation or formatting outside the JSON.

  output_json: true

user_feedback_task:
  description: >
    Analyze the JSON generated by the 'query_refinement_task':
    {analysis_output}

    Your task has three steps:

    1. **Detect** all fields with a value of `"null"` or `"unrealistic"`:
       - Main fields: `origin`, `destination`, `departure_time`
       - Constraints: each `constraints[].value` (such as `"budget"`, `"airline"`, `"transport_mode"`, etc.)

    2. For each invalid field detected:
      - ⚠️ You must generate one message **for each field**, and keep the same order between `missing_or_unrealistic_fields[]` and `messages[]`.

      - If the value is **"null"**:
         - Briefly explain why this information is essential.
         - Generate a **clear and direct question** to ask the user.
         - Example: "What is your departure location?"

      - If the value is **"unrealistic"**:
         - ⚠️ Never display the initial value deemed unrealistic.
         - Explain in clear terms **why** it is considered unrealistic, based on **real-world knowledge** (typical prices, expected distances, realistic schedules, etc.).
         - ⚠️ You must always provide a **realistic recommendation adapted to the specific context**:
           - For a budget that is too low, propose a plausible price range (e.g., "between 300 and 600 euros").
           - For a transport mode incompatible with the origin/destination, explain the incompatibility and propose suitable alternatives.
           - For a date in the past, explain that travel must be scheduled in the future and ask for a realistic future date.
         - Your message must include both:
           1. A **brief explanation** of why the value is invalid;
           2. A **realistic, actionable suggestion** the user can respond to.
         - ❌ Never say “the value is too low” without giving an example of an acceptable range.
         - ✅ Always adapt the recommendation to the trip's cities, type of transport, and user preferences when possible.

         - If the affected field is `departure_time`:
           - Do **not** attempt to determine or display the current time in any location.
           - Simply explain that the provided date is unrealistic (e.g., in the past or too soon) and ask the user for a new **future** date and time.
           - Example: "The provided date appears to be in the past or too soon. Please provide a realistic future travel date and time."

    3. **Collect** the user’s answers (via terminal) and fill in the `responses` field.

    🔁 You never modify the JSON fields directly.
    You detect, you explain, you ask, you collect.

    ⚠️ Always preserve the order between `missing_or_unrealistic_fields[]` and `messages[]`:  
    The message at index *i* must correspond to the field at index *i*.

    Always tailor your messages to the specific travel context. Never suggest a generic example.

    Example of expected output:

    {
      "missing_or_unrealistic_fields": ["origin", "departure_time", "budget"],
      "messages": [
        "What is your departure location?",
        "The provided date appears to be in the past or too soon. Please provide a realistic future travel date and time.",
        "A flight between Marseille and Rabat typically costs between 300 and 600 euros. What realistic budget would you like to set?"
      ],
      "responses": {
        "origin": "Rabat",
        "departure_time": "2025-07-02T10:00:00",
        "budget": "400"
      }
    }

    If all fields are valid (no "null" or "unrealistic"):

    {
      "missing_or_unrealistic_fields": [],
      "messages": [],
      "responses": {}
    }

  expected_output: >
    A JSON object with three elements:
    - `missing_or_unrealistic_fields`: list of detected invalid fields
    - `messages`: the personalized questions to ask the user, in the same order
    - `responses`: dictionary of user-provided answers, by field

  output_json: true

finalize_query_task:

  description: >
    This task combines two sources:
    1. The JSON automatically generated by the `query_refinement_task`:
       {analysis_output}
    2. The JSON containing user responses collected via `user_feedback_task`:
       {feedback_output}

    🎯 Goal: produce a final **complete and clean** query, with all fields filled and no `"null"` or `"unrealistic"` values.

    ▶️ Steps:

    1. **Replace main fields if a response was given**:
       - For `origin`, `destination`, or `departure_time`:
         - If a response exists in `feedback_output["responses"]`, **replace the value in `analysis_output`** with it.

    2. **Update constraints**:
       - For each entry in `feedback_output["responses"]` that **matches a constraint** (e.g., `budget`, `airline`, `transport_mode`, etc.):
         - Find the corresponding constraint in `analysis_output["constraints"]` and **replace its `value`** with the new one.
         - If the constraint did not exist before, you may **add it**.

    3. **Filter final constraints**:
       - Keep only constraints whose `value` is **neither `"null"` nor `"unrealistic"`**.
       - Remove all empty or invalid constraints.

    🧱 Expected final structure:
    {
      "origin": "string",  // always filled
      "destination": "string",  // always filled
      "departure_time": "string",  // always filled
      "constraints": [
        {"type": "string", "value": "string"},
        ...
      ]
    }

    ✅ Example:

    - `analysis_output`:
      {
        "origin": "Paris",
        "destination": null,
        "departure_time": "tomorrow",
        "constraints": [
          {"type": "budget", "value": null},
          {"type": "airline", "value": "Air France"}
        ]
      }

    - `feedback_output`:
      {
        "responses": {
          "destination": "London",
          "budget": "500"
        }
      }

    - Expected result:
      {
        "origin": "Paris",
        "destination": "London",
        "departure_time": "tomorrow",
        "constraints": [
          {"type": "budget", "value": "500"},
          {"type": "airline", "value": "Air France"}
        ]
      }

  expected_output: >
    A final complete JSON, without null or unrealistic values, ready to be used by the recommendation system.

  output_json: true
