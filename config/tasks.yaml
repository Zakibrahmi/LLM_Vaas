objective_function_task:
  description: >
    Tu es une experte en optimisation de trajets multimodaux, spécialisée dans la modélisation mathématique.

    🎯 Objectif : à partir de données structurées (requête utilisateur, liste des VaaS, régions), tu dois formuler **en langage naturel** une **description rigoureuse et bien rédigée** du problème d’optimisation à résoudre.

    ✍️ Cette description est destinée à un générateur de code automatique. Elle doit être :
    - claire, structurée et professionnelle,
    - rédigée dans un français fluide (évite les listes mécaniques),
    - adaptée au contexte concret de la requête.

    Tu dois absolument t’appuyer sur :
    - `{final_query}` : contient `origin`, `destination`, `constraints`, etc.,
    - `{vaas}` : liste réelle des VaaS (ne jamais inventer d’attribut),
    - `{regions}` : régions à traverser dans l’ordre.

    === ✅ Contenu exigé de ta réponse ===

    1. **Objectifs**
       Décris en introduction ce que l’on cherche à optimiser entre la ville de départ et celle d’arrivée.
       Explique que le but est de **minimiser trois critères** : le coût global, la durée estimée (via l’inverse des vitesses), et les émissions de CO₂.
       Précise que ces critères sont **regroupés dans une seule fonction objectif** par une **somme simple non pondérée**.

    2. **Variables de décision**
       Décris que l’on doit sélectionner **exactement un VaaS par région** traversée.
       Chaque VaaS sélectionné doit :
       - couvrir la région concernée (`region in coverd_regions`),
       - respecter **toutes les contraintes utilisateur valides**.

    3. **Contraintes**
       Analyse la requête pour extraire les **contraintes explicites**. Détaille-les **en langage naturel** et avec leurs **valeurs précises**.
       - Si la contrainte est booléenne, écris : "Chaque VaaS doit être équipé de la climatisation."
       - Si c’est une contrainte numérique, sauf budget, écris : "Le VaaS doit permettre le transport d’au moins 2 bagages."
       - Si c’est une contrainte textuelle, écris : "Le repas proposé doit être végétarien."
       Tous les VaaS qui ne respectent **aucune contrainte** sont **exclus avant optimisation**.

       Si un **budget** est présent, indique clairement :
       > "Le budget est une borne souple fixée à `X` euros. Une pénalité quadratique est appliquée si le coût total dépasse ce montant."
       On ne filtre jamais les vaas avec le budget, on applique seulement la pénalité ! 
       ⚠️ Ne parle pas de budget s’il est absent.

    4. **Fonction objectif**
       Décris avec rigueur comment la valeur à minimiser est calculée :
       - addition des coûts (`cost`),
       - des temps (`1 / speed`),
       - des émissions (`emission`),
       - +1_000_000 de pénalité si un VaaS ne couvre pas sa région,
       - pénalité quadratique `(coût_total - budget)²` si le budget est dépassé (seulement si défini).

       Termine par une **formule explicite** :
       ```
       objectif = coût_total + temps_total + émissions_total + pénalités
       ```

    5. **Type d’optimisation**
       Propose un **algorithme réel connu**, adapté à une sélection discrète avec contraintes strictes et espace combinatoire.
       Écris clairement son nom et justifie pourquoi il convient ici.

    ✨ Qualité attendue de rédaction :
    - Le texte doit être rédigé dans un français fluide et professionnel, sans phrases hachées.
    - Les formulations doivent être naturelles, variées, et éviter les structures répétitives.
    - Chaque section doit enchaîner logiquement avec la suivante (cohérence discursive).
    - Une reformulation mathématique élégante de la fonction objectif est fortement encouragée (ex : formule symbolique en notation claire).
    - Évite les formulations trop génériques. Utilise toujours les **valeurs exactes** extraites de la requête, sans interprétation ni approximation.

  expected_output: >
    Un texte bien rédigé, structuré, professionnel et contextuel, contenant :
    - Les objectifs optimisés avec précision,
    - Les variables de décision,
    - Les contraintes utilisateur détaillées avec leurs vraies valeurs,
    - La fonction objectif expliquée avec une formule claire,
    - Le nom explicite d’un algorithme d’optimisation adapté et justifié.

generate_code_task:
  description: |
    Tu es une développeuse Python spécialisée dans l’optimisation combinatoire sous contraintes.

    🎯 Objectif : Générer un module Python **exécutable et réaliste** qui applique un algorithme d’optimisation **strictement identique** à celui spécifié dans la `objective_description`.

    === DONNÉES ENTRANTES ===
    - {objective_description} : description textuelle d’un problème d’optimisation multi-objectif transformé en mono-objectif par une **somme simple non pondérée** de :
      • coût total,
      • temps de trajet (1 / vitesse),
      • émissions de CO₂.
      Elle contient :
      • les **contraintes utilisateur** précises à respecter (booléennes, entières, etc.),
      • la liste **ordonnée** des régions à traverser,
      • le nom exact de l’**algorithme** à appliquer.

    - {vaas} : la **liste réelle** des VaaS disponibles (pas d’invention, pas d’hallucination).

    === RÈGLES STRICTES À RESPECTER ===
    - Tu dois filtrer les VaaS uniquement sur les **contraintes métier explicites** (climatisation, support vélo, etc.).
    - ⚠️ **Ne jamais filtrer les VaaS sur la base du coût** : le budget est géré exclusivement par la **pénalité quadratique dans la fonction `objective_function()`**.
    - Les individus manipulés par l’algorithme sont toujours des **listes plates d’indices locaux** `[0, 1, 0]`.
    - Le module ne doit contenir **aucun appel direct à `__main__`**.
    - Tu dois **respecter à la lettre** l’algorithme mentionné, sans substitution.
    - ⚠️ Dans la fonction `objective_function()`, la vérification de couverture régionale doit être faite **en parcourant `resolved_indices`**, pas avec les indices locaux.
    Exemple  de la boucle correcte: 
    ```python
    for region, global_index in zip(regions, resolved_indices):
    if region not in vaas[global_index]["coverd_regions"]:
        penalty += 1e6
      ```
    - Le résultat final de `optimize()` doit être :
      ```python
      {
        "best_score": float,
        "best_solution": list[int]  # indices locaux
      }
      ```
    - Tu dois exporter :
      - `regions_exported = regions`,
      - `candidates_per_region_exported = {region: liste_indices_globaux}` pour chaque région.

    === 🛠️ ÉTAPES À IMPLÉMENTER ===

    1. **Filtrage des VaaS par région** :
       - Pour chaque région `r` de `regions`, créer `candidates_per_region[r]` contenant les **indices globaux** des VaaS qui :
         - couvrent `r`,
         - respectent toutes les contraintes spécifiées (ex: `climatisation == True`, `places_min >= 3`, `support_velo == True`, etc.).
       - ⚠️ Ne jamais appliquer ici de filtre basé sur un plafond budgétaire.

       **Exemple conforme :**
       ```python
       if (
           vaa["climatisation"] and
           vaa["places_min"] >= 3 and
           vaa["support_velo"] and
           vaa["type_energy"] == "électrique"
       ):
           for region in vaa["coverd_regions"]:
               if region in candidates_per_region:
                   candidates_per_region[region].append(idx)
       ```

    2. **Fonctions de composantes** :
       - `compute_total_cost(indices)`
       - `compute_total_time(indices)`
       - `compute_total_emission(indices)`
       - `objective_function(indices)` :
         - ⚠️ Reconvertit les indices locaux en VaaS globaux :
           ```python
           resolved_indices = [
               candidates_per_region[region][i]
               for region, i in zip(regions, indices)
           ]
           ```
         - Tous les calculs doivent utiliser `resolved_indices`.
         - Re-vérifie la couverture (`region not in vaa["coverd_regions"]`) → pénalité +1e6,
         - Si un budget est défini → pénalité quadratique (`(coût_total - budget)**2`),
         - Retourne la **somme unique** : `cost + time + emission + penalty`.

    3. **Implémenter l’algorithme exact** :
       - Respecte les noms et bornes dynamiques :
         ```python
         lb = [0] * len(regions)
         ub = [len(candidates_per_region[region]) - 1 for region in regions]
         ```
       - Applique l’algorithme donné dans la description.

    4. **Fonction `optimize()`** :
       - Effectue l’optimisation complète.
       - Retourne : `{"best_score": ..., "best_solution": [indices locaux]}`

    5. **Variables exportées pour exécution postérieure** :
       ```python
       regions_exported = regions
       candidates_per_region_exported = {
           region: candidates_per_region[region]
           for region in regions
       }
       ```

  expected_output: |
    Un module Python complet contenant :
    - Les imports nécessaires selon l’algorithme,
    - La construction de `candidates_per_region` (sans filtrage budgétaire),
    - Les fonctions métier,
    - La pénalité quadratique si `budget` est défini,
    - La fonction `optimize()` qui retourne uniquement les **indices locaux**,
    - Les variables exportées `regions_exported` et `candidates_per_region_exported`,
    - Aucun appel à `__main__`.

run_optimizer_task:
  description: |
    Tu es une experte en exécution rigoureuse de scripts Python d’optimisation combinatoire.

    🎯 Objectif : Exécuter **intégralement et exactement** le code Python fourni dans `generated_code`, et retourner **le résultat réel** de l’optimisation, tel que calculé par l’algorithme implémenté.

    === CODE PYTHON À EXÉCUTER ===
    {generated_code}

    === DONNÉES DISPONIBLES ===
    {vaas}

    === ⚠️ INSTRUCTIONS STRICTES ===
    - Exécute **le code tel quel**, sans y apporter aucune modification.
    - Appelle la fonction `optimize()` définie dans le code.
    - Ne réinterprète **jamais** les résultats calculés, ne fais **aucune correction manuelle**.
    - Les pénalités (y compris celles liées au budget, à la couverture, ou aux préférences) sont **déjà incluses dans `objective_function()`**.
    - Tu dois donc utiliser **le score retourné tel quel**, même s’il est pénalisé.

    🛠️ Étapes obligatoires :
    1. Exécute le code Python fourni (il contient l’implémentation complète).
    2. Appelle la fonction `optimize()` → elle retourne un dictionnaire :
       ```python
       {"best_score": float, "best_solution": list[int]}
       ```
    3. Récupère aussi les variables exportées dans le code :
       - `regions_exported` : liste des régions traversées dans l’itinéraire.
       - `candidates_per_region_exported` : dictionnaire `{region: [indices globaux]}`.

    4. Pour chaque `i, local_index` dans `best_solution`, fais :
       ```python
       region = regions_exported[i]
       global_index = candidates_per_region_exported[region][local_index]
       uid = vaas[global_index]["uid"]
       ```

    5. Retourne un dictionnaire final **strictement conforme** à ce format :

       ```json
       {
         "best_score": <float>,
         "best_solution": ["uid1", "uid2", ...]
       }
       ```

    ✅ Contraintes importantes :
    - N’ajoute **aucun post-traitement**, ne modifie pas la solution.
    - Ne filtre **aucune contrainte** ici : tout est déjà pris en compte dans la fonction objectif.
    - Accepte les résultats tels quels, même si le score est mauvais à cause de fortes pénalités.

  expected_output: |
    Un JSON au format :
    {
      "best_score": float,
      "best_solution": [list of string UIDs]
    }
    Ces données doivent être **strictement** issues du code exécuté, sans correction ni modification.

final_recommendation_task:
  description: >
    Tu es une experte en recommandations personnalisées de transport multimodal.

    🎯 Objectif : Générer un **texte fluide, naturel et professionnel** qui recommande un itinéraire optimisé à l’utilisatrice, à condition que tous les VaaSs choisis respectent strictement ses contraintes (à l’exception du budget).

    === DONNÉES DISPONIBLES ===
    - Requête de l’utilisatrice : {final_query}
    - Résultat d’optimisation : {optimization_result}
    - Liste des VaaSs disponibles : {vaas}

    🧩 Ta mission :
    1. Vérifie si une solution est disponible :
       - Si `best_solution` est vide ou manquante, explique simplement qu’aucune combinaison réalisable n’a été trouvée avec les contraintes imposées.
       - Sinon, récupère les VaaSs correspondants à partir de leurs `uid`.

    2. Vérifie les contraintes :
       - Pour chaque VaaS sélectionné, vérifie individuellement s’il respecte **toutes les contraintes** présentes dans `final_query["constraints"]`, **à l’exception du budget**.
       - Règles :
         - Une contrainte de type booléen ou string est respectée si la valeur dans le VaaS est **exactement égale** à celle attendue.
         - Une contrainte numérique est respectée si la valeur dans le VaaS est **supérieure ou égale** à celle attendue (ex: `"baggage": 2` est respectée par un VaaS avec `baggage = 3`).

    3. Rédige la recommandation finale :
       - Si **toutes les contraintes sont respectées** :
         - Rédige un **paragraphe professionnel** présentant l’itinéraire proposé, les VaaSs choisis, leurs principales caractéristiques (coût, vitesse, émissions…).
         - Calcule le **coût total** de l’itinéraire.
         - Gestion du budget :
           - Si un budget est présent dans `final_query["constraints"]` :
             - Si le coût total dépasse ce budget, indique-le clairement dans le paragraphe (ex: « le coût total de X € dépasse votre budget de Y € »).
             - Sinon, indique que le coût est conforme au budget.
           - Si aucun budget n’a été spécifié, indique simplement le coût total sans commentaire.
       - Si **au moins une contrainte est violée** :
         - Rédige un **paragraphe fluide et clair** expliquant que certaines contraintes n’ont pas été respectées.
         - Précise dans le texte **quelles contraintes sont violées** et **par quels VaaSs**, sans liste technique (✅/❌).
         - Termine par une **invitation ouverte** à relancer une recherche avec des critères plus souples (ex: « Souhaitez-vous relancer une recherche avec des contraintes assouplies ? »).

    ✅ Règles strictes :
    - Ne jamais valider une solution partielle.
    - Ne jamais inventer de VaaS ni modifier les données.
    - Être transparente, factuelle et bienveillante dans tous les cas.
    - Le dépassement du budget **n’invalide pas** la solution, mais doit être mentionné.

  expected_output: >
    🔸 Si la solution est valide :
    - Un **paragraphe clair, positif et professionnel** recommandant l’itinéraire optimisé.
    - Présentation des VaaSs sélectionnés (nom, coût, vitesse, émissions…).
    - Mention du coût total et, **si applicable**, du dépassement du budget.

    🔸 Sinon :
    - Un **paragraphe fluide** expliquant les contraintes non respectées, avec les VaaSs concernés.
    - Une **invitation à ajuster les critères** pour relancer une recherche.
