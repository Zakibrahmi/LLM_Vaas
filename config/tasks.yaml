objective_function_task:
  description: >
    You are an expert in multimodal route optimization, specialized in mathematical modeling.

    🎯 Objective: based on structured data (user query, list of VaaSs, regions), you must formulate **in natural language** a **rigorous and well-written** description of the optimization problem to be solved.

    ✍️ This description is intended for an automatic code generator. It must be:
    - clear, structured, and professional,
    - written in fluent English (avoid mechanical lists),
    - adapted to the concrete context of the query.

    You must absolutely rely on:
    - `{final_query}`: contains `origin`, `destination`, `constraints`, etc.,
    - `{vaas}`: actual list of VaaSs (never invent any attribute),
    - `{regions}`: regions to cross in order.

    === ✅ Required content of your response ===

    1. **Objectives**
       Describe in the introduction what is sought to be optimized between the departure and arrival cities.
       Explain that the goal is to **minimize three criteria**: total cost, estimated duration (via the inverse of speeds), and CO₂ emissions.
       Specify that these criteria are **combined into a single objective function** by a **simple unweighted sum**.

    2. **Decision variables**
       Describe that exactly **one VaaS must be selected per traversed region**.
       Each selected VaaS must:
       - cover the concerned region (`region in covered_regions`),
       - respect **all valid user constraints**.

    3. **Constraints**
       Analyze the query to extract the **explicit constraints**. Detail them **in natural language** with their **precise values**.
       - If the constraint is boolean, write: "Each VaaS must be equipped with air conditioning."
       - If it is a numeric constraint, except budget, write: "The VaaS must allow transporting at least 2 pieces of luggage."
       - If it is a textual constraint, write: "The offered meal must be vegetarian."
       All VaaSs that do not respect **any constraint** are **excluded before optimization**.

       If a **budget** is present, clearly indicate:
       > "The budget is a soft bound set at `X` euros. A quadratic penalty is applied if the total cost exceeds this amount."
       We never filter VaaSs by budget, we only apply the penalty!
       ⚠️ Do not mention budget if it is absent.

    4. **Objective function**
       Rigorously describe how the value to minimize is calculated:
       - sum of costs (`cost`),
       - times (`1 / speed`),
       - emissions (`emission`),
       - +1,000,000 penalty if a VaaS does not cover its region,
       - quadratic penalty `(total_cost - budget)²` if the budget is exceeded (only if defined).

       End with an **explicit formula**:
       ```
       objective = total_cost + total_time + total_emissions + penalties
       ```

    5. **Type of optimization**
       Propose a **known real algorithm**, adapted to discrete selection with strict constraints and combinatorial space.
       Clearly write its name and justify why it is suitable here.

    ✨ Expected writing quality:
    - The text must be written in fluent and professional English, without fragmented sentences.
    - Formulations should be natural, varied, and avoid repetitive structures.
    - Each section should logically follow the previous one (discursive coherence).
    - An elegant mathematical reformulation of the objective function is strongly encouraged (e.g., clear symbolic notation).
    - Avoid overly generic formulations. Always use the **exact values** extracted from the query, without interpretation or approximation.

  expected_output: >
    A well-written, structured, professional and contextual text containing:
    - Precisely optimized objectives,
    - Decision variables,
    - Detailed user constraints with their real values,
    - The objective function explained with a clear formula,
    - The explicit name of a suitable optimization algorithm and its justification.

generate_code_task:
  description: |
    You are a Python developer specialized in combinatorial optimization under constraints.

    🎯 Objective: Generate a **realistic and executable** Python module implementing an optimization algorithm **strictly identical** to the one specified in the `objective_description`.

    === INPUT DATA ===
    - {objective_description}: textual description of a multi-objective optimization problem transformed into a single objective by a **simple unweighted sum** of:
      • total cost,
      • travel time (1 / speed),
      • CO₂ emissions.
      It includes:
      • the precise **user constraints** to respect (boolean, integer, etc.),
      • the **ordered** list of regions to traverse,
      • the exact name of the **algorithm** to apply.

    - {vaas}: the **real list** of available VaaSs (no invention, no hallucination).

    === STRICT RULES TO FOLLOW ===
    - You must filter VaaSs only based on **explicit business constraints** (air conditioning, bike support, etc.).
    - ⚠️ **Never filter VaaSs based on cost**: the budget is handled exclusively by the **quadratic penalty inside the `objective_function()`**.
    - Individuals manipulated by the algorithm are always **flat lists of local indices** `[0, 1, 0]`.
    - The module must contain **no direct `__main__` calls**.
    - You must **strictly follow** the algorithm mentioned, without substitution.
    - ⚠️ Inside `objective_function()`, the coverage check must be done **by iterating over `resolved_indices`**, not local indices.
      Correct example of the loop:
      ```python
      for region, global_index in zip(regions, resolved_indices):
          if region not in vaas[global_index]["coverd_regions"]:
              penalty += 1e6
      ```
    - The final result of `optimize()` must be:
      ```python
      {
        "best_score": float,
        "best_solution": list[int]  # local indices
      }
      ```
    - You must export:
      - `regions_exported = regions`,
      - `candidates_per_region_exported = {region: list_of_global_indices}` for each region.

    === 🛠️ STEPS TO IMPLEMENT ===

    1. **Filtering VaaS by region**:
       - For each region `r` in `regions`, create `candidates_per_region[r]` containing the **global indices** of VaaSs that:
         - cover `r`,
         - respect all specified constraints (e.g. `air_conditioning == True`, `min_places >= 3`, `bike_support == True`, etc.).
       - ⚠️ Never apply any filtering here based on a budget ceiling.

       **Compliant example:**
       ```python
       if (
           vaa["air_conditioning"] and
           vaa["min_places"] >= 3 and
           vaa["bike_support"] and
           vaa["type_energy"] == "electric"
       ):
           for region in vaa["coverd_regions"]:
               if region in candidates_per_region:
                   candidates_per_region[region].append(idx)
       ```

    2. **Component functions**:
       - `compute_total_cost(indices)`
       - `compute_total_time(indices)`
       - `compute_total_emission(indices)`
       - `objective_function(indices)`:
         - ⚠️ Convert local indices back to global VaaS indices:
           ```python
           resolved_indices = [
               candidates_per_region[region][i]
               for region, i in zip(regions, indices)
           ]
           ```
         - All computations must use `resolved_indices`.
         - Re-check coverage (`region not in vaa["coverd_regions"]`) → penalty +1e6,
         - If a budget is defined → quadratic penalty `(total_cost - budget)**2`,
         - Returns the **single sum**: `cost + time + emission + penalty`.

    3. **Implement the exact algorithm**:
       - Respect the dynamic names and bounds:
         ```python
         lb = [0] * len(regions)
         ub = [len(candidates_per_region[region]) - 1 for region in regions]
         ```
       - Apply the algorithm exactly as described.

    4. **`optimize()` function**:
       - Performs the complete optimization.
       - Returns: `{"best_score": ..., "best_solution": [local indices]}`

    5. **Exported variables for later use**:
       ```python
       regions_exported = regions
       candidates_per_region_exported = {
           region: candidates_per_region[region]
           for region in regions
       }
       ```

  expected_output: |
    A complete Python module containing:
    - The necessary imports according to the algorithm,
    - Construction of `candidates_per_region` (without budget filtering),
    - Business functions,
    - Quadratic penalty if `budget` is defined,
    - The `optimize()` function returning only **local indices**,
    - Exported variables `regions_exported` and `candidates_per_region_exported`,
    - No call to `__main__`.

run_optimizer_task:
  description: |
    You are an expert in rigorous execution of combinatorial optimization Python scripts.

    🎯 Objective: Execute the provided Python code in `generated_code` **completely and exactly**, and return **the real result** of the optimization as computed by the implemented algorithm.

    === PYTHON CODE TO EXECUTE ===
    {generated_code}

    === AVAILABLE DATA ===
    {vaas}

    === ⚠️ STRICT INSTRUCTIONS ===
    - Execute **the code as is**, without any modification.
    - Call the function `optimize()` defined in the code.
    - Never reinterpret the computed results, do **not** apply any manual correction.
    - Penalties (including budget, coverage, or preference penalties) are **already included in `objective_function()`**.
    - Therefore, you must use **the returned score as is**, even if penalized.

    🛠️ Mandatory steps:
    1. Execute the provided Python code (it contains the full implementation).
    2. Call the function `optimize()` → it returns a dictionary:
       ```python
       {"best_score": float, "best_solution": list[int]}
       ```
    3. Also retrieve the exported variables from the code:
       - `regions_exported`: list of regions crossed in the route.
       - `candidates_per_region_exported`: dictionary `{region: [global indices]}`.

    4. For each `i, local_index` in `best_solution`, do:
       ```python
       region = regions_exported[i]
       global_index = candidates_per_region_exported[region][local_index]
       uid = vaas[global_index]["uid"]
       ```

    5. Return a final dictionary **strictly matching** this format:

       ```json
       {
         "best_score": <float>,
         "best_solution": ["uid1", "uid2", ...]
       }
       ```

    ✅ Important constraints:
    - Do **not** add any post-processing, do not modify the solution.
    - Do **not** filter any constraint here: everything is already handled inside the objective function.
    - Accept results as is, even if the score is poor due to heavy penalties.

  expected_output: |
    A JSON formatted as:
    {
      "best_score": float,
      "best_solution": [list of string UIDs]
    }
    These data must be **strictly** from the executed code, without correction or modification.

final_recommendation_task:
  description: >
    You are an expert in personalized multimodal transport recommendations.

    🎯 Objective: Generate a **fluent, natural, and professional** text recommending an optimized itinerary to the user, provided that all chosen VaaSs strictly meet her constraints (except for budget).

    === AVAILABLE DATA ===
    - User’s request: {final_query}
    - Optimization result: {optimization_result}
    - List of available VaaSs: {vaas}

    🧩 Your mission:
    1. Check if a solution is available:
       - If `best_solution` is empty or missing, simply explain that no feasible combination was found given the imposed constraints.
       - Otherwise, retrieve the VaaSs corresponding to their `uid`s.

    2. Verify constraints:
       - For each selected VaaS, check individually if it respects **all constraints** present in `final_query["constraints"]`, **except budget**.
       - Rules:
         - A boolean or string constraint is respected if the VaaS value is **exactly equal** to the expected one.
         - A numeric constraint is respected if the VaaS value is **greater than or equal to** the expected value (e.g., `"baggage": 2` is respected by a VaaS with `baggage = 3`).

    3. Write the final recommendation:
       - If **all constraints are met**:
         - Write a **professional paragraph** presenting the proposed itinerary, the chosen VaaSs, and their main features (cost, speed, emissions…).
         - Calculate the **total cost** of the itinerary.
         - Budget handling:
           - If a budget is present in `final_query["constraints"]`:
             - If the total cost exceeds this budget, clearly mention it in the paragraph (e.g., “the total cost of X € exceeds your budget of Y €”).
             - Otherwise, state that the cost complies with the budget.
           - If no budget is specified, simply mention the total cost without comment.
       - If **at least one constraint is violated**:
         - Write a **clear and fluent paragraph** explaining that some constraints were not respected.
         - Specify **which constraints are violated** and **by which VaaSs**, without using technical lists (✅/❌).
         - End with an **open invitation** to rerun a search with more flexible criteria (e.g., “Would you like to rerun a search with relaxed constraints?”).

    ✅ Strict rules:
    - Never validate a partial solution.
    - Never invent VaaSs or modify data.
    - Always be transparent, factual, and kind.
    - Budget overruns **do not invalidate** the solution but must be mentioned.

  expected_output: >
    🔸 If the solution is valid:
    - A **clear, positive, and professional paragraph** recommending the optimized itinerary.
    - Presentation of the selected VaaSs (name, cost, speed, emissions…).
    - Mention of the total cost and, **if applicable**, any budget overrun.

    🔸 Otherwise:
    - A **fluent paragraph** explaining unmet constraints, with the concerned VaaSs.
    - An **invitation to adjust criteria** to rerun the search.
