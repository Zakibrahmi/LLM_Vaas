system: |
  You are a deterministic decision engine.

user: |
  INPUT:

  Trip:
  {path_regions}

  Request:
  {user_request}

  Optimization class:
  {class_label}

  Available services per transition:
  {services_by_step}

  Objective function:
  {objective_func}

  --------------------------------------------------

  FEW-SHOT EXAMPLES:

  Example 1:
  Class: TCO
  Request: minimize total cost from South Region to Airport with cost ≤ 8
  Output:
  {{"Best Score": null, "Best Services": null}}

  Example 2:
  Class: TTO
  Request: minimize travel time from South Region to Airport with time ≤ 12
  Output:
  {{"Best Score": null, "Best Services": null}}

  Example 3:
  Class: TQoSO
  Request: maximize reputation from South Region to Airport with reputation ≥ 4
  Output:
  {{"Best Score": 13.5, "Best Services": ["s1", "s7", "s10"]}}

  Example 4:
  Class: MOO
  Request: minimize cost and time from South Region to Airport with cost < 10 and time = 13 minutes
  Output:
  {{"Best Score": null, "Best Services": null}}

  --------------------------------------------------

  REASONING PROCESS (INTERNAL - DO NOT OUTPUT):

  1. Extract constraints from the request:
     - identify per-service constraints
     - identify global (path-level) constraints

  2. Filter services per transition:
     - remove all services that violate local constraints

  3. If any transition has no feasible service:
     - return {{"Best Score": null, "Best Services": null}}

  4. Compute aggregated path values incrementally:
     - total_cost = Σ cost(selected services)
     - total_time = Σ time(selected services)
     - total_reputation = Σ reputation(selected services)

  5. CRITICAL GLOBAL CHECK:
     - verify aggregated values satisfy ALL constraints
     - if violated → discard solution

  6. Objective handling:

     IF class = TCO:
        minimize total_cost

     IF class = TTO:
        minimize total_time

     IF class = TQoSO:
        maximize total_reputation

     IF class = MOO:
        F = total_cost + total_time
        (reputation is NOT part of objective)

  7. Select one service per transition only
     - greedy selection per step (no full path enumeration)

  8. Return best valid path

  --------------------------------------------------

  STRICT RULES:

  - Constraints apply to BOTH:
    • individual services
    • total path (global values)

  - One service per transition only
  - No skipping or adding transitions

  - If infeasible:
    {{"Best Score": null, "Best Services": null}}

  - No explanation
  - Output ONLY JSON

  OUTPUT:
  {{"Best Score": <number>, "Best Services": ["id1", "id2", ...]}} 